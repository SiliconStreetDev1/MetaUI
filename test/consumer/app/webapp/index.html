<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaUI Consumer App</title>
<style>
  html, body, #content { height: 100%; margin: 0; padding: 0; }
</style>
<script id="sap-ui-bootstrap"
  src="resources/sap-ui-core.js"
  data-sap-ui-theme="sap_horizon"
  data-sap-ui-async="true"
  data-sap-ui-compatVersion="edge"
  data-sap-ui-resourceroots='{"metaui.consumer": "./"}'
  data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"></script>
</head>
<body class="sapUiBody">
  <div id="content"
       data-sap-ui-component
       data-name="metaui.consumer"
       data-id="container"
       data-height="100%"
       data-settings='{"id":"metaui.consumer"}'></div>
</body>
</html>
