specVersion: "3.0"
metadata:
  name: metaui.starter
type: application

# The UI5 framework itself. Without this block `ui5 serve` has no UI5 to serve, and the
# version here is the one your app is actually tested against.
framework:
  name: OpenUI5
  version: "1.120.50"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon

# Bundles MetaUI into this app's build output, so `ui5 build` produces one deployable.
# This is Route A in docs/wiki/Deployment.md. Delete this block for Route B, where MetaUI
# is deployed separately as a shared BSP library and must NOT be bundled into each app.
builder:
  settings:
    includeDependency:
      - nz.co.siliconst.ui5.metaui
