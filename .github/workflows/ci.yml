# Every gate lives in verify.yml so that CI and the release run exactly the same
# checks. Do not add a step here: add it to verify.yml, or the release will not
# run it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml
