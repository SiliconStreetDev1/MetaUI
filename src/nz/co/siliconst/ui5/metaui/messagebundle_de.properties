#XFLD: Coordinates rendered in display mode. {0} is the latitude, {1} the longitude. "Lat"/"Lng" are abbreviations.
metaui.geolocation.coordinates=Breite: {0}, L\u00E4nge: {1}

#XFLD: Placeholder telling the user how to commit one entry of a multi-value input. "Enter" is the keyboard key.
metaui.multiInput.placeholder=Wert eingeben und Eingabetaste dr\u00FCcken

#XFLD: Placeholder inside an empty password field.
metaui.password.placeholder=Kennwort eingeben

#XTOL: Tooltip of the button that reopens a text editor as a full-screen dialog.
metaui.editor.expand=Editor vergr\u00F6\u00DFern

#XTIT: Title of the full-screen editor dialog when the schema supplies no label of its own.
metaui.editor.dialogTitle=Bearbeiten

#XBUT: Button that dismisses the full-screen editor dialog.
metaui.editor.close=Schlie\u00DFen

#XBUT: Button opening an editable nested dialog. {0} is the field label. German puts the verb last.
metaui.nested.edit={0} bearbeiten

#XBUT: Button opening a read-only nested dialog. {0} is the field label. German puts the verb last.
metaui.nested.view={0} anzeigen

#XBUT: As metaui.nested.view, with a summary of the content. {0} is the field label, {1} the entry count or a value list.
metaui.nested.viewSummary={0} anzeigen ({1})

#XFLD: Label of a nested list when the schema supplies none.
metaui.nested.array.label=Eintr\u00E4ge

#XTOL: Tooltip on a nested-list button whose contents failed validation and the validator gave no reason.
metaui.nested.array.invalid=Ung\u00FCltige verschachtelte Liste

#XFLD: Label of a nested object when the schema supplies none. Identical to the English word by coincidence.
metaui.nested.object.label=Details

#XTIT: Title of the nested object dialog when the schema supplies no label.
metaui.nested.object.title=Objektdetails

#XTOL: Tooltip on a nested-object button whose contents failed validation and the validator gave no reason.
metaui.nested.object.invalid=Ung\u00FCltiges verschachteltes Objekt

#XFLD: Label of a schema reference ($ref) when neither the schema nor the reference name supplies one.
metaui.nested.reference.label=Referenzierte Entit\u00E4t

#XTOL: Tooltip on a reference button whose contents failed validation and the validator gave no reason.
metaui.nested.reference.invalid=Ung\u00FCltige referenzierte Entit\u00E4t

#XBUT: Button that resets every field of the form to its empty value.
metaui.action.clearForm=Formular leeren

#XBUT: Button that submits the form.
metaui.action.submit=Senden

#XBUT: Button that opens the web address held by the field.
metaui.action.openLink=Link \u00F6ffnen

#XFLD: Placeholder in a type-ahead search field that queries a remote service.
