# ============================================================================
# MetaUI library message bundle - German (de).
#
# PROVENANCE: translated by the agent that introduced the i18n layer, reviewed
# by nobody. It is grammatical, idiomatic German written against the key
# comments in messagebundle.properties - it is NOT raw machine output and it
# is NOT a reviewed SAP translation. Treat it as a good first draft: it exists
# so the locale fallback chain is exercised by a real second language rather
# than assumed, and so the placeholder word-order problem is demonstrable.
# Replace it with reviewed text before shipping a German Fiori app.
#
# Word order is the reason {0} is a placeholder and not a concatenation. For
# metaui.validation.range.exclusiveMinimum, English puts the bound last
# ("Value must be greater than 5.") while German puts the verb last
# ("Der Wert muss gr\u00F6\u00DFer als 5 sein."). String concatenation cannot express
# that; a placeholder inside the sentence can.
#
# Non-ASCII characters are written as \uXXXX escapes, which is what OpenUI5's
# own sap/m/messagebundle_de.properties does. UI5 pins no encoding of its own:
# sap/base/util/Properties loads the file with dataType "text", so the browser
# decodes it according to the server's Content-Type charset, and the parser then
# unescapes \uXXXX. An escaped file is pure ASCII and therefore decodes
# identically whatever charset the web server happens to declare.
# ============================================================================

#XMSG: Field-level error shown when a mandatory field is left empty.
metaui.validation.required=Dieses Feld ist ein Pflichtfeld.

#XMSG: Field-level error shown when an explicitly non-nullable field is set to null.
metaui.validation.required.null=Der Wert darf nicht null sein.

#XMSG: Field-level error for a string shorter than the schema minLength. {0} is the minimum character count.
metaui.validation.minLength=Die Mindestl\u00E4nge betr\u00E4gt {0} Zeichen.

#XMSG: Field-level error for a string longer than the schema maxLength. {0} is the maximum character count.
metaui.validation.maxLength=Die maximale L\u00E4nge betr\u00E4gt {0} Zeichen.

#XMSG: Field-level error when the entered text does not match the regular expression declared in the schema.
metaui.validation.pattern=Die Eingabe entspricht nicht dem erforderlichen Muster.

#XMSG: Field-level error for a malformed email address.
metaui.validation.email=Bitte geben Sie eine g\u00FCltige E-Mail-Adresse ein.

#XMSG: Field-level error for a malformed web address.
metaui.validation.url=Bitte geben Sie eine g\u00FCltige URL ein.

#XMSG: Field-level error when a web address uses a scheme other than http or https. Do not translate "http"/"https".
metaui.validation.url.protocol=Die URL muss das Protokoll http oder https verwenden.

#XMSG: Field-level error for a malformed international bank account number. "IBAN" is an international abbreviation.
metaui.validation.iban=Bitte geben Sie eine g\u00FCltige IBAN ein.

#XMSG: Field-level error when an IBAN is well formed but its check digits do not match.
metaui.validation.iban.checksum=Die IBAN-Pr\u00FCfsumme ist ung\u00FCltig.

#XMSG: Field-level error when a whole number is expected and a fraction was entered.
metaui.validation.integer=Der Wert muss eine ganze Zahl sein.

#XMSG: Field-level error when a number is infinite or not a number.
metaui.validation.number.finite=Der Wert muss eine endliche Zahl sein.

#XMSG: Field-level error for the JSON Schema multipleOf constraint. {0} is the step size.
metaui.validation.multipleOf=Der Wert muss ein Vielfaches von {0} sein.

#XMSG: Field-level error for an inclusive lower bound. {0} is the smallest accepted value.
metaui.validation.range.minimum=Der Wert muss gr\u00F6\u00DFer oder gleich {0} sein.

#XMSG: Field-level error for an exclusive lower bound. {0} is the bound the value has to exceed.
metaui.validation.range.exclusiveMinimum=Der Wert muss gr\u00F6\u00DFer als {0} sein.

#XMSG: Field-level error for an inclusive upper bound. {0} is the largest accepted value.
metaui.validation.range.maximum=Der Wert muss kleiner oder gleich {0} sein.

#XMSG: Field-level error for an exclusive upper bound. {0} is the bound the value has to stay below.
metaui.validation.range.exclusiveMaximum=Der Wert muss kleiner als {0} sein.

#XMSG: Field-level error when a value is outside the allowed set. {0} is a comma-separated list of allowed values.
metaui.validation.enum=Der Wert muss einer der folgenden Werte sein: {0}.

#XMSG: Field-level error when a value must equal one fixed constant. {0} is that constant.
metaui.validation.const=Der Wert muss ''{0}'' sein.

#XMSG: Error for a list with too few entries. {0} is the minimum number of entries.
metaui.validation.array.minItems=Mindestens {0} Eintrag/Eintr\u00E4ge erforderlich.

#XMSG: Error for a list with too many entries. {0} is the maximum number of entries.
metaui.validation.array.maxItems=H\u00F6chstens {0} Eintrag/Eintr\u00E4ge zul\u00E4ssig.

#XMSG: Error when a list contains the same entry twice and duplicates are not allowed.
metaui.validation.array.uniqueItems=Alle Eintr\u00E4ge m\u00FCssen eindeutig sein.

#XMSG: Error for an object with too few properties. {0} is the minimum number of properties.
metaui.validation.object.minProperties=Mindestens {0} Eigenschaften erforderlich.

#XMSG: Error for an object with too many properties. {0} is the maximum number of properties.
metaui.validation.object.maxProperties=H\u00F6chstens {0} Eigenschaften zul\u00E4ssig.

#XMSG: Shown when a validator itself throws. {0} is the untranslated technical exception text.
metaui.validation.systemError=Systemvalidierungsfehler: {0}

#XMSG: Prefixes a nested error with the field it came from. {0} is the field label, {1} the error. Reorder as the language requires.
metaui.validation.field={0}: {1}

#XMSG: Prefixes a table-row error with its row number. {0} is the 1-based row number, {1} the error.
metaui.validation.row=Zeile {0}: {1}

#XMSG: Stand-in used when a nested field is invalid but the validator reported no reason.
metaui.validation.invalidValue=Ung\u00FCltiger Wert

#XMSG: Stand-in used when a list entry is invalid but the validator reported no reason.
metaui.validation.invalidItem=Ung\u00FCltiger Eintrag

#XMSG: Field-level error when a date picker cannot parse what was typed.
metaui.picker.date.parseError=Bitte geben Sie ein g\u00FCltiges Datum ein.

#XMSG: Field-level error when a time picker cannot parse what was typed.
metaui.picker.time.parseError=Bitte geben Sie eine g\u00FCltige Uhrzeit ein.

#XMSG: Field-level error when a combined date-and-time picker cannot parse what was typed.
metaui.picker.dateTime.parseError=Bitte geben Sie ein g\u00FCltiges Datum mit Uhrzeit ein.

#XMSG: Field-level error when a numeric input cannot be read as a number.
metaui.number.parseError=Bitte geben Sie eine g\u00FCltige Zahl ein.

#XMSG: Field-level error when an integer field is given a fraction or unparseable text.
metaui.number.integerParseError=Bitte geben Sie eine g\u00FCltige ganze Zahl ein.

#XFLD: Heading above a key-value editor when the schema supplies no label of its own.
metaui.dictionary.defaultLabel=Zuordnung

#XBUT: Button that appends one empty key-value row to the dictionary editor.
metaui.dictionary.addEntry=Eintrag hinzuf\u00FCgen

#XMSG: Empty state shown in place of the rows when the dictionary holds no entries yet.
metaui.dictionary.empty=Keine Eintr\u00E4ge vorhanden.

#XMSG: Error shown when dictionary keys are blank or the same key is used twice.
metaui.dictionary.invalidKeys=Die Zuordnung enth\u00E4lt leere oder doppelte Schl\u00FCssel.

#XFLD: Display-mode stand-in shown when no file has been attached to the field.
metaui.fileUpload.noFile=Keine Datei hochgeladen

#XTOL: Alternative text of the preview image for an uploaded file, read by screen readers.
metaui.fileUpload.imageAlt=Hochgeladenes Bild

#XFLD: Placeholder inside the file uploader's path field before a file is picked.
metaui.fileUpload.placeholder=Datei ausw\u00E4hlen ...

#XBUT: Button on the file uploader that opens the operating system file picker.
metaui.fileUpload.browse=Durchsuchen ...

#XTOL: Alternative text of a photo captured with the device camera, read by screen readers.
