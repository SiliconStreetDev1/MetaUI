#XFLD: Placeholder in a dropdown whose entries are loaded from a remote service.
metaui.dataSource.selectPlaceholder=Ausw\u00E4hlen ...

#XFLD: Placeholder in a field whose value is picked from a remote value-help dialog.
metaui.dataSource.valueHelpPlaceholder=Wert ausw\u00E4hlen ...

#XTIT: Title of the remote value-help dialog when the schema supplies no label.
metaui.dataSource.valueHelpTitle=Wert ausw\u00E4hlen

#XMSG: Error shown on a hardware control when the browser does not implement the required device API. {0} is the device capability name, e.g. "Camera".
metaui.hardware.failure.unsupported={0} ist in diesem Browser nicht verf\u00FCgbar.

#XMSG: Error shown on a hardware control when the user or browser site permissions refused device access. {0} is the device capability name, e.g. "Camera".
metaui.hardware.failure.denied=Der Zugriff auf {0} wurde blockiert. Erlauben Sie ihn in den Websiteberechtigungen des Browsers und versuchen Sie es erneut.

#XMSG: Error shown on a hardware control when the device API did not respond before the timeout expired. {0} is the device capability name, e.g. "Location".
metaui.hardware.failure.timeout={0} hat nicht rechtzeitig reagiert. Bitte versuchen Sie es erneut.

#XMSG: Error shown on a hardware control when the device API failed for any other reason. {0} is the device capability name, e.g. "Camera".
metaui.hardware.failure.failed={0} konnte nicht verwendet werden.

#XMSG: Validation error recorded when a field failed to render and therefore cannot be validated. {0} is the field path or label.
metaui.validation.fieldRenderFailed=Das Feld ''{0}'' konnte nicht dargestellt werden, daher konnte sein Wert nicht validiert werden.

#XMSG: Validation error recorded when a field plugin failed to initialize and therefore cannot be validated. {0} is the field path or label.
metaui.validation.fieldInitFailed=Das Feld ''{0}'' konnte nicht initialisiert werden, daher konnte sein Wert nicht validiert werden.
