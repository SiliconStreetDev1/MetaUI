# ============================================================================
# MetaUI library message bundle - German (de).
#
# PROVENANCE: translated by the agent that introduced the i18n layer, reviewed
# by nobody. It is grammatical, idiomatic German written against the key
# comments in messagebundle.properties - it is NOT raw machine output and it
# is NOT a reviewed SAP translation. Treat it as a good first draft: it exists
# so the locale fallback chain is exercised by a real second language rather
# than assumed, and so the placeholder word-order problem is demonstrable.
# Replace it with reviewed text before shipping a German Fiori app.
#
# Word order is the reason {0} is a placeholder and not a concatenation. For
# metaui.validation.range.exclusiveMinimum, English puts the bound last
# ("Value must be greater than 5.") while German puts the verb last
# ("Der Wert muss gr\u00F6\u00DFer als 5 sein."). String concatenation cannot express
# that; a placeholder inside the sentence can.
#
# Non-ASCII characters are written as \uXXXX escapes, which is what OpenUI5's
# own sap/m/messagebundle_de.properties does. UI5 pins no encoding of its own:
# sap/base/util/Properties loads the file with dataType "text", so the browser
# decodes it according to the server's Content-Type charset, and the parser then
# unescapes \uXXXX. An escaped file is pure ASCII and therefore decodes
# identically whatever charset the web server happens to declare.
# ============================================================================

