# ----------------------------------------------------------------------------
# Schema configuration errors surfaced on fields.
# ----------------------------------------------------------------------------

#XMSG: Validation error when a schema references a validator name that is not registered. {0} is the validator name.
metaui.validation.config.unregisteredValidator=Schema configuration error: Requested validator ''{0}'' is not registered.

#XMSG: Validation error when the arrayItems validator is invoked without its constraint object.
metaui.validation.config.arrayItemsObject=Schema configuration error: 'arrayItems' requires a minItems/maxItems/uniqueItems object.

#XMSG: Validation error when a numeric schema constraint is not a number. {0} is the keyword name, e.g. "maxLength".
metaui.validation.config.mustBeNumber=Schema configuration error: ''{0}'' must be a number.

#XMSG: Validation error when a positive numeric schema constraint is zero, negative, or non-numeric. {0} is the keyword name.
metaui.validation.config.mustBePositiveNumber=Schema configuration error: ''{0}'' must be a positive number.

#XMSG: Validation error when a string schema constraint is not a string. {0} is the keyword name, e.g. "pattern".
metaui.validation.config.mustBeString=Schema configuration error: ''{0}'' must be a string.

#XMSG: Validation error when a regex pattern exceeds the maximum safe length. {0} is the character limit.
metaui.validation.config.patternTooLong=Schema configuration error: ''pattern'' is unsafe (longer than {0} characters).

#XMSG: Validation error when a regex pattern exceeded its evaluation time budget.
metaui.validation.config.patternTimeout=Schema configuration error: 'pattern' is unsafe (exceeded its time budget).

#XMSG: Validation error when a regex pattern has invalid regular expression syntax. {0} is the pattern source.
metaui.validation.config.invalidRegex=Schema configuration error: invalid regex pattern ''{0}''.

#XMSG: Validation error when static analysis refuses a regex pattern as a catastrophic-backtracking risk. {0} is the refusal detail.
metaui.validation.config.patternUnsafe=Schema configuration error: ''pattern'' is unsafe ({0}).

#XMSG: Validation error when a regex pattern with unproven complexity is evaluated against an over-long input. {0} is the character limit.
metaui.validation.config.patternUnproven=Schema configuration error: ''pattern'' is unsafe (its running time is unproven and the value is longer than {0} characters).

