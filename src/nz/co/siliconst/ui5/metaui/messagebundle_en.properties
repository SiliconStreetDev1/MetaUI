# ============================================================================
# MetaUI library message bundle - English (en).
#
# Generated from messagebundle.properties, which stays the translator source:
# it carries the #XMSG text-type comments and the placeholder notes. This file
# carries only the texts, which is how OpenUI5's own libraries lay the pair out
# (compare sap/m/messagebundle.properties against sap/m/messagebundle_en.properties).
#
# It is not redundant. The UI5 builder derives sap.ui5/library/i18n/supportedLocales
# in manifest.json from the messagebundle_*.properties files present, and UI5's
# default fallbackLocale is "en". Without this file supportedLocales is ["", "de"],
# "en" is not among them, and every bundle load logs
#   The fallback locale 'en' is not contained in the list of supported locales
# as an error. With it, supportedLocales is ["", "de", "en"] and the chain is clean.
#
# The QUnit test "i18n: the English locale bundle and the raw bundle agree" fetches
# both files and fails if a key or a text drifts between them.
# ============================================================================

