# ============================================================================
# MetaUI library message bundle - default (English) / raw fallback.
#
# Loaded by sap.ui.core.Lib.getResourceBundleFor("nz.co.siliconst.ui5.metaui")
# through the helper nz/co/siliconst/ui5/metaui/utils/I18n.
#
# Every text here reaches an end user's screen (field value states, message
# strips, the message popover). Developer diagnostics are NOT in this file:
# Logger output and the schema-authoring / regex-refusal messages stay in
# English on purpose, because they are read by whoever debugs the app.
#
# Parameters
# ----------
# Keys whose text contains {0}, {1}, ... are resolved with
# ResourceBundle#getText(key, aArgs), which runs the text through
# sap/base/strings/formatMessage. In those texts a literal apostrophe must be
# written doubled ('') and a literal brace must be quoted. Texts with no
# placeholder are resolved without aArgs and are therefore NOT reformatted,
# so a single apostrophe is safe in them.
#
# Never build a message by concatenating a bound value onto a translated
# fragment: the placeholder has to stay inside the sentence so a translator
# can move it.
#
# Text types (#XMSG, #XFLD, ...) are the SAP translator-context convention and
# are required - they tell the translator what kind of UI element the text is
# rendered in. All texts below are messages, hence #XMSG.
# ============================================================================

#XMSG: Field-level error shown when a mandatory field is left empty.
metaui.validation.required=This field is required.

#XMSG: Field-level error shown when an explicitly non-nullable field is set to null.
metaui.validation.required.null=Value cannot be null.

#XMSG: Field-level error for a string shorter than the schema minLength. {0} is the minimum character count.
metaui.validation.minLength=Minimum length is {0} characters.

#XMSG: Field-level error for a string longer than the schema maxLength. {0} is the maximum character count.
metaui.validation.maxLength=Maximum length is {0} characters.

#XMSG: Field-level error when the entered text does not match the regular expression declared in the schema.
metaui.validation.pattern=Input does not match the required pattern.

#XMSG: Field-level error for a malformed email address.
metaui.validation.email=Please enter a valid email address.

#XMSG: Field-level error for a malformed web address.
metaui.validation.url=Please enter a valid URL.

#XMSG: Field-level error when a web address uses a scheme other than http or https. Do not translate "http"/"https".
metaui.validation.url.protocol=URL must use http or https protocol.

#XMSG: Field-level error for a malformed international bank account number. "IBAN" is an international abbreviation.
metaui.validation.iban=Please enter a valid IBAN.

#XMSG: Field-level error when an IBAN is well formed but its check digits do not match.
metaui.validation.iban.checksum=IBAN checksum is invalid.

#XMSG: Field-level error when a whole number is expected and a fraction was entered.
metaui.validation.integer=Value must be a whole integer.

#XMSG: Field-level error when a number is infinite or not a number.
metaui.validation.number.finite=Value must be a finite number.

#XMSG: Field-level error for the JSON Schema multipleOf constraint. {0} is the step size.
metaui.validation.multipleOf=Value must be a multiple of {0}.

#XMSG: Field-level error for an inclusive lower bound. {0} is the smallest accepted value.
metaui.validation.range.minimum=Value must be greater than or equal to {0}.

#XMSG: Field-level error for an exclusive lower bound. {0} is the bound the value has to exceed.
metaui.validation.range.exclusiveMinimum=Value must be greater than {0}.

#XMSG: Field-level error for an inclusive upper bound. {0} is the largest accepted value.
metaui.validation.range.maximum=Value must be less than or equal to {0}.

#XMSG: Field-level error for an exclusive upper bound. {0} is the bound the value has to stay below.
metaui.validation.range.exclusiveMaximum=Value must be less than {0}.

#XMSG: Field-level error when a value is outside the allowed set. {0} is a comma-separated list of allowed values.
metaui.validation.enum=Value must be one of: {0}.

#XMSG: Field-level error when a value must equal one fixed constant. {0} is that constant.
metaui.validation.const=Value must equal ''{0}''.

#XMSG: Error for a list with too few entries. {0} is the minimum number of entries.
metaui.validation.array.minItems=At least {0} item(s) required.

#XMSG: Error for a list with too many entries. {0} is the maximum number of entries.
metaui.validation.array.maxItems=At most {0} item(s) allowed.

#XMSG: Error when a list contains the same entry twice and duplicates are not allowed.
metaui.validation.array.uniqueItems=All items must be unique.

#XMSG: Error for an object with too few properties. {0} is the minimum number of properties.
metaui.validation.object.minProperties=At least {0} properties required.

#XMSG: Error for an object with too many properties. {0} is the maximum number of properties.
metaui.validation.object.maxProperties=At most {0} properties allowed.

#XMSG: Shown when a validator itself throws. {0} is the untranslated technical exception text.
metaui.validation.systemError=System validation error: {0}

#XMSG: Prefixes a nested error with the field it came from. {0} is the field label, {1} the error. Reorder as the language requires.
metaui.validation.field={0}: {1}

#XMSG: Prefixes a table-row error with its row number. {0} is the 1-based row number, {1} the error.
metaui.validation.row=Row {0}: {1}

#XMSG: Stand-in used when a nested field is invalid but the validator reported no reason.
metaui.validation.invalidValue=Invalid value

#XMSG: Stand-in used when a list entry is invalid but the validator reported no reason.
metaui.validation.invalidItem=Invalid item

# ----------------------------------------------------------------------------
# Date / time / number pickers and inputs.
# Shown as the field value state when what the user typed cannot be parsed at
# all, which is a separate condition from a parsed value failing a constraint.
# ----------------------------------------------------------------------------

#XMSG: Field-level error when a date picker cannot parse what was typed.
metaui.picker.date.parseError=Please enter a valid date.

#XMSG: Field-level error when a time picker cannot parse what was typed.
metaui.picker.time.parseError=Please enter a valid time.

#XMSG: Field-level error when a combined date-and-time picker cannot parse what was typed.
metaui.picker.dateTime.parseError=Please enter a valid date and time.

#XMSG: Field-level error when a numeric input cannot be read as a number.
metaui.number.parseError=Please enter a valid number.

#XMSG: Field-level error when an integer field is given a fraction or unparseable text.
metaui.number.integerParseError=Please enter a valid whole number.

