# ----------------------------------------------------------------------------
# Nested object / array / $ref dialogs.
#
# The trigger button reads "Edit <thing>" or "View <thing>", where <thing> is
# the field's own label. The label is {0} rather than a concatenation because
# German puts the verb last ("Adresse bearbeiten"), so the two parts swap.
# ----------------------------------------------------------------------------

#XBUT: Button opening an editable nested dialog. {0} is the field label, e.g. "Address".
metaui.nested.edit=Edit {0}

#XBUT: Button opening a read-only nested dialog. {0} is the field label, e.g. "Address".
metaui.nested.view=View {0}

#XBUT: As metaui.nested.view, with a summary of the content. {0} is the field label, {1} the entry count or a value list.
metaui.nested.viewSummary=View {0} ({1})

#XFLD: Label of a nested list when the schema supplies none.
metaui.nested.array.label=Items

#XTOL: Tooltip on a nested-list button whose contents failed validation and the validator gave no reason.
metaui.nested.array.invalid=Invalid nested array

#XFLD: Label of a nested object when the schema supplies none.
metaui.nested.object.label=Details

#XTIT: Title of the nested object dialog when the schema supplies no label.
metaui.nested.object.title=Object Details

#XTOL: Tooltip on a nested-object button whose contents failed validation and the validator gave no reason.
metaui.nested.object.invalid=Invalid nested object

#XFLD: Label of a schema reference ($ref) when neither the schema nor the reference name supplies one.
metaui.nested.reference.label=Referenced Entity

#XTOL: Tooltip on a reference button whose contents failed validation and the validator gave no reason.
metaui.nested.reference.invalid=Invalid referenced entity

